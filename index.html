<!DOCTYPE html>
<html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Magti Game</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;font-family:system-ui;overflow:hidden}header{height:48px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-weight:800}header button{background:#22c55e;border:0;color:#fff;padding:6px 10px;border-radius:8px;font-weight:800}#game{width:100vw;height:calc(100dvh - 48px);background:linear-gradient(#7dd3fc,#dcfce7);display:block;touch-action:none}.hud{font-size:13px}.ctrl{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;z-index:10}.ctrl button{width:64px;height:64px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.55);color:#fff;font-size:22px}.ctrl .big{width:76px;height:76px;background:#16a34a}.menu{position:fixed;inset:0;background:rgba(0,0,0,.85);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}.menu button{width:260px;padding:12px;border:0;border-radius:12px;font-weight:800;font-size:16px;background:#22c55e;color:#fff}.menu .sub{opacity:.8;font-size:13px}</style></head><body>
<header><div>🎮 MAGTI • ტური <span id="lv">1</span>/5</div><div class="hud">🍃 <span id="leaf">0</span>/10 • ❤️ <span id="life">3</span> • ⏱️ <span id="time">0</span>s</div><button onclick="toggleSound()">🔊</button></header>
<canvas id="game"></canvas>
<div class="ctrl"><div><button id="L">◀️</button> <button id="R">▶️</button></div><div><button class="big" id="SUPER">⚡</button> <button class="big" id="J">⬆️</button></div></div>
<div class="menu" id="menu"><h1>🍃 MAGTI GAME</h1><p class="sub">5 ტური • სუპერ ახტომა = Space x2 • ფოთლები შეაგროვე, მტრებს ზემოდან დაახტი</p><div id="levels"></div><p class="sub">მობილურზე: ◀️ ▶️ + ⬆️ და ⚡ = სუპერ ახტომა</p></div>
<script>
let canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W,H,groundY;
function resize(){W=canvas.width=canvas.clientWidth||window.innerWidth;H=canvas.height=canvas.clientHeight||window.innerHeight-48;groundY=H-70;}window.addEventListener('resize',resize);resize();
let AC=null,muted=false;function beep(f,d=0.12,type='square',v=0.15){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}function toggleSound(){muted=!muted;document.querySelector('header button').textContent=muted?'🔇':'🔊';}
let levels=[{name:'ტური 1 - მარტივი',leaves:10,enemies:3,speed:1.2,theme:['#7dd3fc','#dcfce7']},{name:'ტური 2 - საშუალო',leaves:12,enemies:5,speed:1.6,theme:['#fdba74','#fef3c7']},{name:'ტური 3 - რთული',leaves:15,enemies:7,speed:2.0,theme:['#c084fc','#1e1b4b']},{name:'ტური 4 - ექსპერტი',leaves:18,enemies:9,speed:2.5,theme:['#60a5fa','#0f172a']},{name:'ტური 5 - მასტერი',leaves:20,enemies:10,speed:3.0,theme:['#f87171','#450a0a']}];
let unlocked=1,cur=0,playing=false,keys={},player,enemies=[],leaves=[],plats=[],spikes=[],camX=0,runT=0,particles=[],time=0,timer=null,canSuper=true;
function buildMenu(){let d=document.getElementById('levels');d.innerHTML='';levels.forEach((l,i)=>{let b=document.createElement('button');b.textContent=(i<unlocked?'▶️ ':'🔒 ')+l.name;b.disabled=i>=unlocked;b.onclick=()=>startLevel(i);d.appendChild(b);});}
function startLevel(i){cur=i;let L=levels[i];document.getElementById('lv').textContent=i+1;document.getElementById('menu').style.display='none';playing=true;camX=0;time=0;player={x:80,y:0,vx:0,vy:0,w:36,h:52,onGround:false,life:3,face:1};player.y=groundY-player.h;leaves=[];enemies=[];plats=[];spikes=[];particles=[];canSuper=true;let worldW=3200+i*600;for(let k=0;k<L.leaves;k++)leaves.push({x:300+k*(worldW-600)/L.leaves,y:groundY-90-Math.random()*80,taken:false,bob:Math.random()*6});for(let k=0;k<L.enemies;k++)enemies.push({x:600+k*380+Math.random()*100,y:groundY-28,w:28,h:28,dir:Math.random()<.5?-1:1,alive:true});for(let k=0;k<6+i;k++){let px=500+k*450;plats.push({x:px,y:groundY-110-(k%3)*55,w:130,h:16});}for(let k=0;k<i*2;k++)spikes.push({x:900+k*500,y:groundY-14,w:28,h:14});clearInterval(timer);timer=setInterval(()=>{if(playing){time++;document.getElementById('time').textContent=time;}},1000);beep(440,0.2,'square');}
function drawHero(x,y,running){ctx.save();ctx.translate(x,y);ctx.fillStyle='#2563eb';ctx.fillRect(-14,-22,28,18);ctx.fillStyle='#fca5a5';ctx.fillRect(-14,-10,28,26);ctx.fillStyle='#111';ctx.fillRect(-14,-22,28,8);ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc(0,-14,13,0,7);ctx.fill();ctx.fillStyle='#7c2d12';ctx.fillRect(-12,-8,24,8);ctx.fillStyle='#1f2937';ctx.fillRect(-5,-12,5,4);ctx.fillRect(3,-12,5,4);ctx.fillStyle='#78350f';ctx.fillRect(-12,14,28,12);ctx.fillStyle='#78350f';if(running){let s=Math.sin(runT*0.4)>0;ctx.fillRect(s?-16:2,26,12,16);ctx.fillRect(s?4:-18,26,12,10);}else{ctx.fillRect(-14,26,10,16);ctx.fillRect(4,26,10,16);}ctx.restore();}
function drawLeaf(x,y){ctx.save();ctx.translate(x,y+Math.sin(Date.now()/300)*3);ctx.fillStyle='#16a34a';ctx.beginPath();ctx.ellipse(0,0,10,14,0,0,7);ctx.fill();ctx.strokeStyle='#14532d';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,12);ctx.stroke();ctx.restore();}
function loop(){requestAnimationFrame(loop);if(!playing)return;ctx.fillStyle=levels[cur].theme[0];ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<12;i++){let cx=((i*260-camX*0.3)%(W+200))-100;ctx.beginPath();ctx.ellipse(cx,40+(i%3)*30,36,14,0,0,7);ctx.fill();}ctx.fillStyle=levels[cur].theme[1];ctx.fillRect(0,groundY,W,H-groundY);ctx.fillStyle='#78350f';ctx.fillRect(0,groundY,W,8);plats.forEach(p=>{ctx.fillStyle='#a16207';ctx.fillRect(p.x-camX,p.y,p.w,p.h);});spikes.forEach(s=>{ctx.fillStyle='#dc2626';ctx.beginPath();ctx.moveTo(s.x-camX,s.y+s.h);ctx.lineTo(s.x-camX+s.w/2,s.y);ctx.lineTo(s.x-camX+s.w,s.y+s.h);ctx.fill();});leaves.forEach(l=>{if(!l.taken)drawLeaf(l.x-camX,l.y);});enemies.forEach(e=>{if(!e.alive)return;ctx.fillStyle='#7c2d12';ctx.fillRect(e.x-camX,e.y,e.w,e.h);ctx.fillStyle='#fff';ctx.fillRect(e.x-camX+5,e.y+6,6,6);ctx.fillRect(e.x-camX+17,e.y+6,6,6);});let p=player;let left=keys['ArrowLeft']||keys['a']||keys['A']||keys['left'];let right=keys['ArrowRight']||keys['d']||keys['D']||keys['right'];if(left){p.vx=-4.2;p.face=-1;}else if(right){p.vx=4.2;p.face=1;}else p.vx*=0.82;p.x+=p.vx;p.vy+=0.7;if(p.vy>14)p.vy=14;p.y+=p.vy;p.onGround=false;if(p.y+p.h>=groundY){p.y=groundY-p.h;p.vy=0;p.onGround=true;canSuper=true;}plats.forEach(pl=>{if(p.vx>=0&&p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>pl.y&&p.y+p.h<pl.y+22&&p.vy>=0){p.y=pl.y-p.h;p.vy=0;p.onGround=true;canSuper=true;}});if(p.x<0)p.x=0;if(p.x>3200+cur*600-40)p.x=3200+cur*600-40;camX=Math.max(0,p.x-W/2+100);let running=Math.abs(p.vx)>0.5&&p.onGround;if(running)runT++;drawHero(p.x-camX+p.w/2,p.y+p.h,p.vy<-1?false:running);particles.forEach((pt,i)=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.3;pt.life--;ctx.fillStyle='#22c55e';ctx.fillRect(pt.x-camX,pt.y,6,6);if(pt.life<=0)particles.splice(i,1);});leaves.forEach(l=>{if(!l.taken&&Math.abs(p.x-l.x)<30&&Math.abs(p.y-l.y)<40){l.taken=true;beep(880,0.15,'sine',0.2);let got=leaves.filter(x=>x.taken).length;document.getElementById('leaf').textContent=got;}});enemies.forEach(e=>{if(!e.alive)return;e.x+=e.dir*levels[cur].speed;if(e.x<200||e.x>3200)e.dir*=-1;if(Math.abs(p.x-e.x)<30&&Math.abs(p.y-e.y)<30){if(p.vy>2&&p.y<e.y){e.alive=false;p.vy=-9;beep(220,0.15,'square');}else{hurt();}}});spikes.forEach(s=>{if(Math.abs(p.x-s.x)<22&&p.y+p.h>s.y+4)hurt();});if(p.y>H+200)hurt();let got=leaves.filter(x=>x.taken).length;if(got>=levels[cur].leaves&&p.x>3200+cur*600-80){winLevel();}document.getElementById('leaf').textContent=got;document.getElementById('life').textContent=p.life;}
function hurt(){if(!playing)return;player.life--;beep(160,0.25,'sawtooth');document.getElementById('life').textContent=player.life;if(player.life<=0){playing=false;alert('დამარცხდი! თავიდან სცადე');document.getElementById('menu').style.display='flex';buildMenu();}else{player.x=80;player.y=groundY-player.h;player.vx=0;player.vy=0;camX=0;}}
function winLevel(){playing=false;beep(523,0.15,'sine');setTimeout(()=>beep(659,0.15,'sine'),150);setTimeout(()=>beep(784,0.3,'sine'),300);unlocked=Math.max(unlocked,cur+2);if(cur>=4){alert('🏆 ყველა ტური გაიარე! შენ ლეგენდა ხარ!');}else{alert('✅ '+levels[cur].name+' დასრულდა!');}document.getElementById('menu').style.display='flex';buildMenu();}
function doJump(superJump){let p=player;if(!playing)return;if(p.onGround){p.vy=-11;beep(520,0.12,'square');}else if(canSuper&&superJump){p.vy=-17;canSuper=false;beep(880,0.2,'sine');for(let i=0;i<14;i++)particles.push({x:p.x,y:p.y+p.h,vx:(Math.random()-0.5)*6,vy:-Math.random()*5,life:30});}}
document.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key===' '){if(player&&player.onGround)doJump(false);else doJump(true);}if(e.key==='w'||e.key==='W'||e.key==='ArrowUp'){if(player&&player.onGround)doJump(false);else doJump(true);}if(e.key==='m'||e.key==='M')toggleSound();});document.addEventListener('keyup',e=>keys[e.key]=false);
function bind(id,down,up){let el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();down();});el.addEventListener('touchend',e=>{e.preventDefault();up&&up();});el.addEventListener('mousedown',down);el.addEventListener('mouseup',up);}
bind('L',()=>keys['left']=true,()=>keys['left']=false);bind('R',()=>keys['right']=true,()=>keys['right']=false);bind('J',()=>doJump(player&&player.onGround?false:true),()=>{});bind('SUPER',()=>doJump(true),()=>{});
buildMenu();loop();
</script></body></html>
